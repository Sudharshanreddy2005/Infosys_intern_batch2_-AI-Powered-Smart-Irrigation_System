
services:
  db:
    container_name: jalsaathi_m3_test_db
    ports: !override
      - "5434:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    container_name: jalsaathi_m3_test_backend
    image: jalsaathi-m3-test-backend:local
    build:
      context: .
      dockerfile: Dockerfile.m3-test
    ports: !override
      - "8001:8000"
    environment:
      OPEN_METEO_FALLBACK_ENABLED: "true"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  farmer-pwa:
    ports: !override
      - "8000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  sensor-ingestion:
    container_name: jalsaathi_m3_test_sensor
    image: jalsaathi-m3-test-backend:local
    build:
      context: .
      dockerfile: Dockerfile.m3-test
    ports: !override
      - "8003:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
    name: jalsaathi_m3_test_postgres_data
