<header class="common-topbar" data-i18n-static>
  <div class="common-topbar-heading">
    <button class="common-topbar-menu" type="button" aria-label="Open navigation menu" aria-controls="sidebar-navigation" aria-expanded="false">
      <svg class="menu-open-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
      <svg class="menu-close-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
    </button>
    <a class="common-topbar-brand" href="/dashboard" aria-label="JalSaathi Smart Irrigation, Brighter Tomorrow">
      <span class="common-topbar-logo" aria-hidden="true">
        <svg viewBox="0 0 64 48"><path d="M30 39C13 34 6 23 8 8c13 0 23 5 27 17C37 13 46 5 60 5c0 15-7 27-23 32l-4 7h-5l2-5z" fill="#d9ef00"></path><path d="M32 43c1-13 8-23 18-31M31 35C23 24 17 17 9 10" stroke="#7fae00" stroke-width="2.5" stroke-linecap="round" fill="none"></path></svg>
      </span>
      <strong class="common-topbar-brand-name">JalSaathi</strong>
      <span class="common-topbar-brand-divider" aria-hidden="true"></span>
      <span class="common-topbar-brand-details">
        <span>Smart Irrigation</span>
        <small>Brighter Tomorrow</small>
      </span>
    </a>
  </div>
  <div class="common-topbar-controls">
    <button class="common-action-button" type="button" data-chart-assistant-open aria-haspopup="dialog" aria-controls="chart-assistant-backdrop" aria-expanded="false" aria-label="Chart Assistant">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M6 16l4-5 3 2 5-7" /><circle cx="6" cy="16" r="1" /><circle cx="10" cy="11" r="1" /><circle cx="13" cy="13" r="1" /><circle cx="18" cy="6" r="1" /></svg>
      <span data-i18n-key="chartAssistant.open">Chart Assistant</span>
    </button>
    <button class="common-action-button" type="button" data-install-app aria-haspopup="dialog" aria-controls="common-install-dialog" aria-label="Install App">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 17v3h16v-3" /></svg>
      <span data-install-label data-i18n-key="install.button">Install App</span>
    </button>
    <div class="common-topbar-control common-notification-control">
      <button class="common-icon-button" type="button" data-notification-toggle aria-haspopup="dialog" aria-controls="notification-panel" aria-expanded="false" aria-label="Notifications">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9zm-8 12h4" /></svg>
        <span class="common-notification-count" data-notification-count hidden>0</span>
      </button>
      <section class="common-dropdown common-notification-panel" id="notification-panel" data-notification-panel role="dialog" aria-label="Notifications" tabindex="-1" hidden>
        <div class="common-dropdown-heading">
          <strong>Notifications</strong>
          <span data-notification-summary>Unread notifications</span>
        </div>
        <p class="common-notification-empty" data-notification-empty>No alerts are available.</p>
        <div data-notification-list></div>
      </section>
    </div>
    <div class="common-topbar-control common-language-control">
      <button class="common-language-toggle" type="button" data-language-toggle aria-haspopup="listbox" aria-expanded="false" aria-label="Select language">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3a14 14 0 0 1 0 18m0-18a14 14 0 0 0 0 18" /></svg>
        <span data-language-label data-i18n-ignore>English</span>
        <span class="common-caret" aria-hidden="true"></span>
      </button>
      <div class="common-dropdown common-language-menu" data-language-menu hidden>
        <div data-language-options role="listbox" aria-label="Available languages"></div>
      </div>
    </div>
    <div class="common-topbar-control common-profile-control">
      <button class="common-profile-toggle" type="button" data-profile-toggle aria-haspopup="menu" aria-controls="profile-menu" aria-expanded="false" aria-label="Farmer profile" hidden>
        <span class="common-profile-avatar" data-profile-avatar data-user-content aria-hidden="true">F</span>
      </button>
      <div class="common-dropdown common-profile-menu" id="profile-menu" data-profile-menu role="menu" aria-label="Profile actions" hidden>
        <a href="/static/sections.html?view=profile" role="menuitem">Profile</a>
        <a href="/static/sections.html?view=profile" role="menuitem">Account Settings</a>
        <a href="/static/sections.html?view=calendar" role="menuitem" data-i18n-key="nav.calendar">Calendar</a>
        <a href="/todo" role="menuitem">Daily Farm To Do List</a>
        <button type="button" role="menuitem" data-topbar-logout>Logout</button>
      </div>
    </div>
  </div>
  <div class="common-modal-backdrop" id="chart-assistant-backdrop" data-chart-backdrop hidden>
    <section class="common-modal common-chart-dialog" role="dialog" aria-modal="true" aria-labelledby="chart-assistant-title">
      <header class="common-modal-heading">
        <div>
          <p class="common-chart-ready" data-i18n-key="chartAssistant.ready">Ready to help</p>
          <h2 class="common-chart-title" id="chart-assistant-title">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1e7650" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19h16M6 16l4-5 3 2 5-7" /><circle cx="6" cy="16" r="1" /><circle cx="10" cy="11" r="1" /><circle cx="13" cy="13" r="1" /><circle cx="18" cy="6" r="1" /></svg>
            <span data-i18n-key="chartAssistant.title">Chart Assistant</span>
          </h2>
          <p data-i18n-key="chartAssistant.description">Explore saved field, irrigation, and weather records.</p>
        </div>
        <div class="common-chart-heading-actions">
          <button class="common-chart-secondary common-chart-new" type="button" data-chart-reset>
            <span aria-hidden="true">+</span><span data-i18n-key="chartAssistant.newConversation">New conversation</span>
          </button>
          <button class="common-modal-close" type="button" data-chart-close><span aria-hidden="true">×</span><span class="common-sr-only" data-i18n-key="chartAssistant.close">Close</span></button>
        </div>
      </header>
      <div class="common-chart-controls">
        <label><span data-i18n-key="chartAssistant.field">Field</span>
          <select data-chart-field><option value="all" data-i18n-key="chartAssistant.allFields">All fields</option></select>
        </label>
        <label><span data-i18n-key="chartAssistant.crop">Crop</span>
          <select data-chart-crop><option value="all" data-i18n-key="chartAssistant.allCrops">All crops</option></select>
        </label>
        <label><span data-i18n-key="chartAssistant.period">Date range</span>
          <select data-chart-period>
            <option value="24h" data-i18n-key="chartAssistant.24h">24 hours</option>
            <option value="7d" selected data-i18n-key="chartAssistant.7d">7 days</option>
            <option value="30d" data-i18n-key="chartAssistant.30d">30 days</option>
            <option value="custom" data-i18n-key="chartAssistant.custom">Custom dates</option>
          </select>
        </label>
        <div class="common-chart-dates" data-chart-dates hidden>
          <label><span data-i18n-key="chartAssistant.startDate">Start date</span><input type="date" data-chart-start></label>
          <label><span data-i18n-key="chartAssistant.endDate">End date</span><input type="date" data-chart-end></label>
        </div>
      </div>
      <p class="common-chart-status" data-chart-status role="status" aria-live="polite" hidden></p>
      <div class="common-chart-thread" data-chart-thread aria-live="polite" aria-relevant="additions text"></div>
      <div class="common-chart-format" data-chart-format-control hidden>
        <label><span data-i18n-key="chartAssistant.reportFormat">Report format</span>
          <select data-chart-format>
            <option value="text" data-i18n-key="chartAssistant.textFormat">Text</option>
            <option value="chart" data-i18n-key="chartAssistant.chartFormat">Chart</option>
          </select>
        </label>
      </div>
      <form class="common-chart-form" data-chart-form>
        <label class="common-sr-only" for="common-chart-question" data-i18n-key="chartAssistant.questionLabel">Ask about your farm data</label>
        <textarea id="common-chart-question" data-chart-question rows="2" maxlength="1500" required placeholder="For example, summarize my planned irrigation." data-i18n-key="chartAssistant.questionPlaceholder"></textarea>
        <div class="common-chart-actions">
          <button class="common-chart-primary" type="submit" data-chart-submit data-i18n-key="chartAssistant.ask">Ask</button>
        </div>
      </form>
    </section>
  </div>
</header>
