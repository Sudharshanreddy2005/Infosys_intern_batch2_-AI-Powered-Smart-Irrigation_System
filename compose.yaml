services:
  db:
    image: postgres:18
    container_name: smart_irrigation_db
    environment:
      POSTGRES_DB: smart_irrigation_db
      POSTGRES_USER: irrigation_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irrigation_user -d smart_irrigation_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: smart-irrigation-backend:latest
    build: .
    container_name: smart_irrigation_backend
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: smart_irrigation_db
      DB_USER: irrigation_user
      APP_ENV: ${APP_ENV:-development}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      TOMORROW_API_KEY: ${TOMORROW_API_KEY:-}
      WEATHER_LOCATION: ${WEATHER_LOCATION:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data: