
services:
  db:
    image: postgres:18
    container_name: smart_irrigation_db
    environment:
      POSTGRES_DB: ${DB_NAME:-smart_irrigation_db}
      POSTGRES_USER: ${DB_USER:-irrigation_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: smart-irrigation-backend:latest
    build: .
    container_name: smart_irrigation_backend
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-smart_irrigation_db}
      DB_USER: ${DB_USER:-irrigation_user}
      DATABASE_URL: ${DATABASE_URL:-}
      APP_ENV: ${APP_ENV:-development}
      NOTIFICATION_DELIVERY_ENABLED: ${NOTIFICATION_DELIVERY_ENABLED:-false}
      FIELD_SOIL_MOISTURE_THRESHOLDS: ${FIELD_SOIL_MOISTURE_THRESHOLDS:-{}}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SUPERVISOR_EMAIL: ${SUPERVISOR_EMAIL:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY_PATH: ${VAPID_PRIVATE_KEY_PATH:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_KEY_BACKUP: ${GEMINI_API_KEY_BACKUP:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      FARMER_PWA_ORIGINS: ${FARMER_PWA_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      TOMORROW_API_KEY: ${TOMORROW_API_KEY:-}
      WEATHER_LOCATION: ${WEATHER_LOCATION:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      IRRIGATION_API_KEY: ${IRRIGATION_API_KEY:-}
      CROP_DISEASE_API_URL: ${CROP_DISEASE_API_URL:-http://host.docker.internal:8001}
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  farmer-pwa:
    build:
      context: ./farmer-pwa
      dockerfile: Dockerfile
      args:
        FASTAPI_ORIGIN: http://backend:8000
        NEXT_PUBLIC_CROP_DISEASE_URL: ${NEXT_PUBLIC_CROP_DISEASE_URL:-http://localhost:8001}
    environment:
      CROP_DISEASE_ORIGIN: ${CROP_DISEASE_ORIGIN:-http://host.docker.internal:8001}
    ports:
      - "8000:3000"
    depends_on:
      backend:
        condition: service_healthy

  sensor-ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app/sensor-ingestion
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-smart_irrigation_db}
      DB_USER: ${DB_USER:-irrigation_user}
      DATABASE_URL: ${DATABASE_URL:-}
      APP_ENV: ${APP_ENV:-development}
      NOTIFICATION_DELIVERY_ENABLED: ${NOTIFICATION_DELIVERY_ENABLED:-false}
      FIELD_SOIL_MOISTURE_THRESHOLDS: ${FIELD_SOIL_MOISTURE_THRESHOLDS:-{}}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SUPERVISOR_EMAIL: ${SUPERVISOR_EMAIL:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY_PATH: ${VAPID_PRIVATE_KEY_PATH:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    ports:
      - "8003:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
