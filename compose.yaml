
services:
  db:
    image: postgres:18
    container_name: smart_irrigation_db
    environment:
      POSTGRES_DB: smart_irrigation_db
      POSTGRES_USER: irrigation_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irrigation_user -d smart_irrigation_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: smart-irrigation-backend:latest
    build: .
    container_name: smart_irrigation_backend
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_KEY_BACKUP: ${GEMINI_API_KEY_BACKUP:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: smart_irrigation_db
      DB_USER: irrigation_user
      FARMER_PWA_ORIGINS: ${FARMER_PWA_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000,http://localhost:3000,http://127.0.0.1:3000}
      APP_ENV: ${APP_ENV:-development}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      TOMORROW_API_KEY: ${TOMORROW_API_KEY:-}
      WEATHER_LOCATION: ${WEATHER_LOCATION:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      IRRIGATION_API_KEY: ${IRRIGATION_API_KEY:-}
      CROP_DISEASE_API_URL: ${CROP_DISEASE_API_URL:-http://host.docker.internal:8001}
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  farmer-pwa:
    build:
      context: ./farmer-pwa
      dockerfile: Dockerfile
      args:
        FASTAPI_ORIGIN: http://backend:8000
        NEXT_PUBLIC_CROP_DISEASE_URL: ${NEXT_PUBLIC_CROP_DISEASE_URL:-http://localhost:8001}
    environment:
      CROP_DISEASE_ORIGIN: ${CROP_DISEASE_ORIGIN:-http://host.docker.internal:8001}
    ports:
      - "8000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
